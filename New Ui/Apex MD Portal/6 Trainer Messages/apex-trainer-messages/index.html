    <div class="spacer"></div>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <div class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input placeholder="Search messages, programs, foods…">
      </div>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" title="Notifications"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6M10 20a2 2 0 0 0 4 0"/></svg></button>
      <!-- identity chip rendered from data/profile.json -->
      <div class="user-chip" id="userChip"></div>
    </div>

    <div class="content">
      <div class="crumb">Apex Fit &nbsp;›&nbsp; <b>Trainer Messages</b></div>
      <div class="head-row">
        <div>
          <h1>Trainer <em>messages</em></h1>
          <p class="subtitle">Conversations with your trainer (Colton Reyes) via <img class="inline-fit" src="assets/img/apex-fit-logo.png" alt="Apex Fit"> app</p>
        </div>
        <button class="new-btn"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14"/></svg>New conversation</button>
      </div>

      <div class="messenger">

        <!-- INBOX (rendered from data/inbox.json) -->
        <section class="panel inbox-panel">
          <div class="panel-head">
            <span class="ttl">INBOX</span>
            <div class="pager">
              <button aria-label="Previous"><svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6"/></svg></button>
              <button aria-label="Next"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6"/></svg></button>
            </div>
          </div>
          <div class="inbox" id="inbox"></div>
        </section>

        <!-- CONVERSATION (rendered from data/conversation.json) -->
        <section class="panel convo">
          <div class="convo-head" id="convoHead"></div>
          <div class="thread-list" id="threadList"></div>
          <div class="composer">
            <textarea id="reply" rows="1" placeholder="Type a reply…  (⌘/Ctrl+Enter to send)"></textarea>
            <button class="send-btn" id="sendBtn">
              <svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
              Send
            </button>
          </div>
        </section>

      </div>
    </div>
  </div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
